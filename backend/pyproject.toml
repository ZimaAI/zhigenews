[project]
name = "zhigenews"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<2.1",
  "alembic>=1.15,<2", "pymysql[rsa]>=1.1,<2", "cryptography>=44",
  "pydantic-settings>=2.8,<3", "httpx>=0.28,<1", "jsonschema>=4.23,<5",
  "celery[redis]>=5.5,<6", "feedparser>=6.0.12,<7", "filelock>=3.20",
  "langchain==1.4.1", "langgraph==1.2.11", "langchain-openai==1.6.2",
  "langgraph-checkpoint-mysql[pymysql,aiomysql,asyncmy]==3.0.0",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-timeout>=2.3,<3", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zhigenews"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs explicitly configured external services", "mysql: needs isolated MySQL", "docker: needs Docker Linux engine"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
