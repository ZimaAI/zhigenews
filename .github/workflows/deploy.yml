name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.images.outputs.backend }}@${{ steps.backend.outputs.digest }}
      web_image: ${{ steps.images.outputs.web }}@${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment script
        run: |
          bash -n infra/deploy/deploy.sh
          python3 -m unittest discover -s infra/deploy/tests -v
      - name: Image names
        id: images
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "backend=ghcr.io/${REPOSITORY,,}-backend" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${REPOSITORY,,}-web" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.backend }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build, check and push frontend
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/deploy/web.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.web }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload release and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          BACKEND_IMAGE: ${{ needs.build.outputs.backend_image }}
          WEB_IMAGE: ${{ needs.build.outputs.web_image }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          port="${DEPLOY_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]]
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          release="/opt/zhigenews/releases/$RELEASE_ID"
          ssh_options=(-p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10)
          printf 'BACKEND_IMAGE=%s\nWEB_IMAGE=%s\n' "$BACKEND_IMAGE" "$WEB_IMAGE" > infra/deploy/release.env
          # Paths intentionally expand on the runner from GitHub's release ID.
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$remote" "mkdir -p '$release'"
          # shellcheck disable=SC2029
          tar -C infra/deploy -czf - compose.yaml deploy.sh release.env |
            ssh "${ssh_options[@]}" "$remote" "tar -xzf - -C '$release'"
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$remote" "bash '$release/deploy.sh'"
