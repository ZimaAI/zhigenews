name: zhigenews-prod

x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-backend: &backend
  <<: *service
  image: ${BACKEND_IMAGE:?release.env must specify BACKEND_IMAGE}
  env_file:
    - path: ${DEPLOY_ROOT:?Set DEPLOY_ROOT}/backend.env
      format: raw
  environment:
    DATABASE_URL: mysql+pymysql://zhigenews:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}@mysql:3306/zhigenews
    REDIS_URL: redis://redis:6379/0
    DATA_DIR: ${DEPLOY_ROOT}/data
    COOKIE_SECURE: "true"
    ALLOWED_ORIGINS: '["https://${USER_DOMAIN:?Set USER_DOMAIN}","https://${ADMIN_DOMAIN:?Set ADMIN_DOMAIN}"]'
    TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-["172.30.0.2/32"]}
    SANDBOX_IMAGE: ${SANDBOX_IMAGE:?Set SANDBOX_IMAGE}
  volumes:
    # The Docker daemon must see exactly the same path as the worker.
    - ${DEPLOY_ROOT}/data:${DEPLOY_ROOT}/data
  depends_on:
    mysql: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  mysql:
    <<: *service
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: zhigenews
      MYSQL_USER: zhigenews
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u zhigenews -D zhigenews -e "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 60

  redis:
    <<: *service
    image: redis:8-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *backend
    # The application validates X-Forwarded-For against Caddy's fixed address.
    command: [uvicorn, 'zhigenews.gateway:app', --host, 0.0.0.0, --port, '8000', --no-proxy-headers]
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=5).read()']
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s

  worker:
    <<: *backend
    command: [celery, -A, 'zhigenews.workers:celery_app', worker, --loglevel=INFO, --concurrency=2, '--hostname=worker@%h']
    stop_grace_period: 12m
    volumes:
      - ${DEPLOY_ROOT}/data:${DEPLOY_ROOT}/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: [CMD-SHELL, 'celery -A zhigenews.workers:celery_app inspect ping --destination "worker@$$HOSTNAME" --timeout 10 | grep -q pong']
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s

  beat:
    <<: *backend
    command: [celery, -A, 'zhigenews.workers:celery_app', beat, --loglevel=INFO, --schedule=/tmp/zhigenews-beat]

  web:
    <<: *service
    image: ${WEB_IMAGE:?release.env must specify WEB_IMAGE}
    environment:
      USER_DOMAIN: ${USER_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default:
        ipv4_address: ${CADDY_IP:-172.30.0.2}
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 5s
      retries: 12

  sandbox:
    profiles: [sandbox]
    image: ${SANDBOX_IMAGE}
    command: ["true"]

networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.0.0/24}
          # Keep dynamic container addresses away from Caddy's static IP.
          ip_range: ${DOCKER_IP_RANGE:-172.30.0.128/25}

volumes:
  mysql-data:
  redis-data:
  caddy-data:
  caddy-config:
